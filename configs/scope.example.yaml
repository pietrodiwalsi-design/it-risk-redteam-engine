  domains:
    - "payments.example.internal"
    - "prod-core-db.example.internal"
  cidr_ranges:
    - "192.168.1.254/32"
    - "10.10.20.1/32"

# Operational boundaries & safety thresholds
rules_of_engagement:
  max_requests_per_second: 5.0
  allow_denial_of_service: false
  llm_token_budget_per_run: 50000
  emergency_stop_enabled: true
  tamper_evident_logging: true
