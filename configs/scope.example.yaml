  assessment_id: "RT-2026-Q4-01"
  authorized_by: "Head of IT Risk Management"
  start_date: "2026-10-15T00:00:00Z"
  end_date: "2026-10-22T23:59:59Z"

# Targets strictly permitted for non-destructive probing and scanning
in_scope:
  domains:
    - "example.internal"
    - "api.example.internal"
    - "ai-agent.example.internal"
  cidr_ranges:
    - "192.168.1.0/24"
    - "10.10.20.0/24"

# Critical assets strictly excluded from any scanning or probing
