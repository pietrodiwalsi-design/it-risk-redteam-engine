[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "it-risk-redteam-engine"
version = "0.1.0"
description = "Enterprise IT Risk & Red Teaming Assessment Engine for surface assets and AI/LLM interfaces"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Peter Van Walsem (pietrodiwalsi-design)" }
]
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
redteam-engine = "src.orchestrator:main"
